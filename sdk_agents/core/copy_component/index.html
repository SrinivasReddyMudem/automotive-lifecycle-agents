<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font: 14px sans-serif; color: var(--text, #31333f); }
    button { padding: 8px 14px; border: 1px solid #8886; border-radius: 8px;
      background: var(--background, white); color: inherit; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--primary, #ff4b4b); }
    button:focus-visible { outline: 2px solid var(--primary, #ff4b4b); outline-offset: 2px; }
    #status { margin-left: 8px; }
    textarea { display: none; box-sizing: border-box; width: 100%; height: 120px; margin-top: 8px; }
  </style>
</head>
<body>
  <button id="copy" type="button" disabled aria-label="Copy full response">Copy full response</button>
  <span id="status" role="status" aria-live="polite"></span>
  <textarea id="fallback" readonly aria-label="Full response for manual copying"></textarea>
  <script>
    const button = document.getElementById("copy");
    const status = document.getElementById("status");
    const fallback = document.getElementById("fallback");
    function send(type, data = {}) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    function resize() {
      send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 8});
    }
    function renderedResponse() {
      const root = window.frameElement.closest('[data-testid="stChatMessageContent"]');
      if (!root) throw new Error("Response container unavailable");
      const doc = root.ownerDocument;
      const selection = doc.getSelection();
      const previous = Array.from({length: selection.rangeCount}, (_, i) => selection.getRangeAt(i).cloneRange());
      const closed = Array.from(root.querySelectorAll("details:not([open])"));
      const inert = Array.from(root.querySelectorAll("[inert]"));
      // Open only for synchronous text extraction. Restore before the next paint.
      // Browser selection preserves rendered headings, list text and code layout.
      try {
        closed.forEach(detail => { detail.open = true; });
        inert.forEach(element => element.removeAttribute("inert"));
        const range = doc.createRange();
        range.selectNodeContents(root);
        selection.removeAllRanges();
        selection.addRange(range);
        return selection.toString();
      } finally {
        closed.forEach(detail => { detail.open = false; });
        inert.forEach(element => element.setAttribute("inert", ""));
        selection.removeAllRanges();
        previous.forEach(range => selection.addRange(range));
      }
    }
    window.addEventListener("message", event => {
      if (event.source !== window.parent || event.data.type !== "streamlit:render") return;
      button.disabled = Boolean(event.data.disabled);
      const theme = event.data.theme || {};
      document.documentElement.style.setProperty("--text", theme.textColor || "#31333f");
      document.documentElement.style.setProperty("--background", theme.backgroundColor || "white");
      document.documentElement.style.setProperty("--primary", theme.primaryColor || "#ff4b4b");
      resize();
    });
    button.addEventListener("click", async () => {
      let text;
      try { text = renderedResponse(); }
      catch (_) {
        status.textContent = "Unable to copy this response. Please refresh and try again.";
        resize();
        return;
      }
      let copied = false;
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (_) {
        fallback.value = text;
        fallback.style.display = "block";
        fallback.focus();
        fallback.select();
        try { copied = document.execCommand("copy"); } catch (_) { /* manual fallback */ }
      }
      fallback.style.display = copied ? "none" : "block";
      status.textContent = copied ? "Copied!" : "Copy blocked — press Ctrl+C / Cmd+C below.";
      if (copied) button.focus();
      resize();
    });
    send("streamlit:componentReady", {apiVersion: 1});
    resize();
  </script>
</body>
</html>
