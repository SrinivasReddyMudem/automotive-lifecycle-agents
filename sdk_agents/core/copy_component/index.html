<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font: 14px sans-serif; color: var(--text, #31333f); }
    button { padding: 8px 14px; border: 1px solid #8886; border-radius: 8px;
      background: var(--background, white); color: inherit; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--primary, #ff4b4b); }
    button:focus-visible { outline: 2px solid var(--primary, #ff4b4b); outline-offset: 2px; }
    #status { margin-left: 8px; }
    textarea { display: none; box-sizing: border-box; width: 100%; height: 120px; margin-top: 8px; }
  </style>
</head>
<body>
  <button id="copy" type="button" disabled aria-label="Copy full response">Copy full response</button>
  <span id="status" role="status" aria-live="polite"></span>
  <textarea id="fallback" readonly aria-label="Full response for manual copying"></textarea>
  <script>
    let text = "";
    const button = document.getElementById("copy");
    const status = document.getElementById("status");
    const fallback = document.getElementById("fallback");
    function send(type, data = {}) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    function resize() {
      send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 8});
    }
    window.addEventListener("message", event => {
      if (event.source !== window.parent || event.data.type !== "streamlit:render") return;
      const next = String(event.data.args.text || "");
      if (next !== text) { status.textContent = ""; fallback.style.display = "none"; }
      text = next;
      button.disabled = Boolean(event.data.disabled) || !text;
      const theme = event.data.theme || {};
      document.documentElement.style.setProperty("--text", theme.textColor || "#31333f");
      document.documentElement.style.setProperty("--background", theme.backgroundColor || "white");
      document.documentElement.style.setProperty("--primary", theme.primaryColor || "#ff4b4b");
      resize();
    });
    button.addEventListener("click", async () => {
      let copied = false;
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (_) {
        // Some browser policies block the async API inside iframes.
        fallback.value = text;
        fallback.style.display = "block";
        fallback.focus();
        fallback.select();
        try { copied = document.execCommand("copy"); } catch (_) { /* manual fallback */ }
      }
      fallback.style.display = copied ? "none" : "block";
      status.textContent = copied ? "Copied!" : "Copy blocked — press Ctrl+C / Cmd+C below.";
      if (copied) button.focus();
      resize();
    });
    send("streamlit:componentReady", {apiVersion: 1});
    resize();
  </script>
</body>
</html>
