name: Keep Streamlit App Awake

# Streamlit Community Cloud puts a free-tier app to sleep after a period
# of no visitor traffic. Anyone opening the link cold then sees a
# platform-level "Zzzz, this app has gone to sleep" interstitial and has
# to click a button and wait for a cold boot before the real app loads.
# That page is served by Streamlit's own proxy — nothing in this repo's
# app code can intercept or skip it, because the app process isn't even
# running yet when a sleeping visitor lands on the URL.
#
# IMPORTANT — this workflow previously used plain curl requests. That
# ran successfully (HTTP 200) every 6 hours for 2 full days straight and
# the app STILL went to sleep — proof that a scripted HTTP GET does not
# count as real activity to Streamlit Cloud's hibernation tracking. It
# very likely requires an actual browser session (the WebSocket
# connection Streamlit's frontend opens after the page loads), which
# curl can never establish. Confirmed empirically: a real headless
# browser visiting the URL does register — verified live against this
# app, both waking it from an active sleep state and loading it cleanly
# while already awake.
#
# Deliberately does NOT submit a query to an agent — that would trigger
# a real Groq/Gemini API call on every scheduled run (4x/day), burning
# through the same limited free-tier quota this project has already hit
# problems with. A plain page load with a real browser is sufficient.
#
# See docs/troubleshooting.md for the full incident this workflow fixes.

on:
  schedule:
    # Every 6 hours — Streamlit's hibernation window is measured in days
    # of total inactivity, so this leaves a large safety margin.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Load the app with a real browser
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Visit the app (wakes it if asleep, keeps it alive if awake)
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          URL = 'https://automotive-skilled-ai-agents.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print(f'Navigating to {URL} ...')
              page.goto(URL, wait_until='domcontentloaded', timeout=60000)

              body_text = page.inner_text('body')
              if 'gone to sleep' in body_text.lower():
                  print('App was asleep — clicking wake button...')
                  page.get_by_text('Yes, get this app back up!', exact=False).first.click()
                  page.wait_for_timeout(20000)
                  print('State after wake click:', page.inner_text('body')[:200])
              else:
                  print('App was already awake.')
                  print('Title:', page.title())

              # Hold the session open briefly — a real WebSocket connection,
              # not just a fetch, is what appears to register as activity.
              page.wait_for_timeout(8000)
              browser.close()
              print('Done.')
          "
